[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validador-modelo210"
version = "0.1.0"
description = "Validación local de modalidad, período y plazos del Modelo 210"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
validar-modelo210 = "validador_modelo210.__main__:main"

[tool.setuptools.packages.find]
include = ["validador_modelo210*"]
